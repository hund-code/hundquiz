<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3e9">
  <title>Pfotenwissen | Hundequiz für Anfänger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #24342d;
      --muted: #65736a;
      --paper: #f5f3e9;
      --surface: #fffefa;
      --green: #315d49;
      --green-dark: #244b39;
      --lime: #d9e6a1;
      --coral: #e88468;
      --line: #dce1d6;
      --good: #e8f2df;
      --bad: #fae9e2;
      --shadow: 0 18px 55px rgb(49 75 57 / 10%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#b7c4a2 0.75px, transparent 0.75px);
      background-size: 20px 20px;
      font-family: "DM Sans", sans-serif;
    }

    button { font: inherit; }

    .page-shell {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 26px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green-dark);
      font-size: 15px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background: var(--lime);
      font-size: 19px;
    }

    .level-tag {
      padding: 8px 12px;
      border: 1px solid #cbd4bd;
      border-radius: 999px;
      color: var(--green-dark);
      background: rgb(255 254 250 / 72%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(380px, 1.05fr);
      min-height: 620px;
      overflow: hidden;
      border: 1px solid rgb(49 93 73 / 12%);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      animation: rise-in 550ms ease-out both;
    }

    .intro {
      position: relative;
      display: flex;
      min-height: 620px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 36px;
      color: #fffdf2;
      background: var(--green);
    }

    .intro::after {
      position: absolute;
      right: -70px;
      bottom: -102px;
      width: 290px;
      aspect-ratio: 1;
      border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 24px rgb(255 255 255 / 5%), 0 0 0 48px rgb(255 255 255 / 4%);
      pointer-events: none;
    }

    .intro-copy { position: relative; z-index: 1; }

    .eyebrow {
      margin: 2px 0 14px;
      color: var(--lime);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 430px;
      margin-bottom: 16px;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(38px, 5vw, 58px);
      font-weight: 600;
      line-height: 1.03;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .photo-trigger {
      position: relative;
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: transparent;
      line-height: 0;
      cursor: zoom-in;
    }

    .photo-trigger:disabled { cursor: wait; }

    .photo-status {
      position: absolute;
      inset: 5px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      font-size: 14px;
      line-height: 1.4;
    }

    .photo-trigger:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 4px;
    }

    .dog-photo {
      display: block;
      width: 100%;
      height: 440px;
      margin-top: 0;
      border: 5px solid rgb(255 255 255 / 20%);
      border-radius: 8px;
      background: #adc09c;
      object-fit: contain;
      object-position: center 44%;
    }

    .photo-dialog {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      padding: 56px 24px 24px;
      border: 0;
      color: white;
      background: rgb(20 29 24 / 97%);
    }

    .photo-dialog[open] {
      display: grid;
      place-items: center;
    }

    .photo-dialog::backdrop { background: rgb(13 19 16 / 92%); }

    .fullscreen-photo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
      object-fit: contain;
    }

    .photo-close {
      position: absolute;
      top: 12px;
      right: 16px;
      display: grid;
      width: 44px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 38%);
      border-radius: 50%;
      color: white;
      background: rgb(255 255 255 / 8%);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }

    .photo-close:focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 3px;
    }

    .intro-note {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 0;
      color: #e7eedf;
      font-size: 12px;
    }

    .note-dot {
      width: 8px;
      aspect-ratio: 1;
      flex: none;
      border-radius: 50%;
      background: var(--coral);
    }

    .quiz-area {
      display: flex;
      flex-direction: column;
      padding: 42px clamp(26px, 5vw, 56px) 34px;
    }

    .quiz-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .quiz-status, .joker-choice, .joker-actions { display: flex; align-items: center; }
    .quiz-status { gap: 6px; }

    .score-chip {
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--green-dark);
      background: #edf1e4;
      white-space: nowrap;
    }

    .joker-choice { gap: 2px; padding: 2px; border-radius: 6px; background: #edf1e4; }
    .joker-caption, .joker-remaining { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .joker-count-button {
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      color: var(--green-dark);
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .joker-count-button[aria-pressed="true"] { color: white; background: var(--green); }
    .joker-count-button:disabled { cursor: default; opacity: 0.72; }

    .progress-track {
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: #e8ebe2;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--coral);
      transition: width 300ms ease;
    }

    .question-count {
      margin: 35px 0 12px;
      color: #77847a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h2 {
      margin-bottom: 24px;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(25px, 3vw, 31px);
      font-weight: 600;
      line-height: 1.2;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      display: grid;
      width: 100%;
      min-height: 58px;
      grid-template-columns: 32px 1fr 20px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: #fffefa;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .intermediate-stage .answer { min-height: 48px; padding: 8px 10px; }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #8ca78e;
      background: #f8faef;
    }

    .answer:focus-visible, .joker-button:focus-visible, .joker-count-button:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid #e88468;
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      display: grid;
      width: 30px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid #dce1d6;
      border-radius: 6px;
      color: #607267;
      background: #f6f7f0;
      font-size: 12px;
      font-weight: 700;
    }

    .answer-text { font-size: 14px; font-weight: 500; line-height: 1.4; }

    .answer-mark {
      color: var(--green);
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .answer.correct { border-color: #9bb98b; background: var(--good); }
    .answer.correct .answer-key { border-color: #9bb98b; background: #d7e8c9; }
    .answer.incorrect { border-color: #e4a18a; background: var(--bad); }
    .answer.incorrect .answer-key { border-color: #e4a18a; background: #f7d6c8; }

    .feedback {
      min-height: 63px;
      margin-top: 16px;
      padding: 12px 14px;
      border-left: 3px solid #a8b796;
      color: #59665d;
      background: #f5f6ef;
      font-size: 13px;
      line-height: 1.5;
    }

    .feedback:empty { visibility: hidden; }
    .feedback strong { color: var(--green-dark); }

    .quiz-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 18px;
    }

    .joker-actions { gap: 6px; }
    .joker-button {
      display: grid;
      width: 40px;
      height: 40px;
      flex: none;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--green-dark);
      background: #f7f8f1;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .joker-button[data-joker="half"] { font-size: 10px; }
    .joker-button:hover:not(:disabled) { border-color: #8ca78e; background: #edf1e4; }
    .joker-button:disabled { color: #9ba49b; background: #f1f2ed; cursor: not-allowed; }

    .next-button, .restart-button {
      min-height: 44px;
      padding: 0 17px;
      border: 0;
      border-radius: 6px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .next-button:hover:not(:disabled), .restart-button:hover { transform: translateY(-1px); background: var(--green-dark); }
    .next-button:disabled { color: #8a968c; background: #e9ece5; cursor: not-allowed; }

    .result-view { display: flex; flex: 1; flex-direction: column; justify-content: center; }
    .result-score {
      display: grid;
      width: 86px;
      aspect-ratio: 1;
      margin: 6px 0 24px;
      place-items: center;
      border: 1px solid #d5dfc5;
      border-radius: 50%;
      color: var(--green-dark);
      background: #eef3e4;
      font-family: Fraunces, Georgia, serif;
      font-size: 28px;
    }

    .result-view h2 { margin-bottom: 12px; font-size: 34px; }
    .result-copy { max-width: 390px; margin-bottom: 24px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .result-view .restart-button { align-self: flex-start; }
    [hidden] { display: none !important; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .page-shell {
        display: flex;
        width: min(560px, calc(100% - 24px));
        height: 100vh;
        height: 100svh;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        padding: 8px 0;
      }

      .topbar { flex: none; margin-bottom: 8px; }
      main {
        min-height: 0;
        flex: 1;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .intro { min-height: 0; justify-content: center; padding: 8px 16px; }
      .intro .eyebrow, .intro-note { display: none; }
      .photo-trigger { margin-top: 0; }
      .dog-photo { height: clamp(150px, 25svh, 220px); object-position: center 48%; }
      .quiz-area { min-height: 0; overflow: hidden; padding: 12px 20px; }
      .quiz-topline { margin-bottom: 8px; }
      .question-count { margin: 12px 0 6px; }
      h2 { margin-bottom: 12px; font-size: 24px; }
      .answers { gap: 8px; }
      .answer { min-height: 48px; padding: 8px 10px; }
      .intermediate-stage .dog-photo { height: clamp(130px, 21svh, 180px); }
      .intermediate-stage .answer { min-height: 42px; padding: 6px 8px; }
      .feedback { min-height: 44px; margin-top: 10px; padding: 8px 10px; }
      .quiz-footer { padding-top: 8px; }
    }

    @media (max-width: 390px) {
      .page-shell { width: calc(100% - 16px); }
      .quiz-area { padding-right: 16px; padding-left: 16px; }
      .answer { grid-template-columns: 30px 1fr 16px; gap: 9px; padding-right: 10px; padding-left: 10px; }
      .answer-text { font-size: 13px; }
      .joker-actions { gap: 4px; }
      .joker-button { width: 36px; height: 36px; }
      .joker-button[data-joker="half"] { font-size: 9px; }
    }

    @media (max-width: 340px) {
      .joker-button { width: 32px; height: 34px; }
      .quiz-status { gap: 4px; }
      .score-chip { padding: 6px; }
      .joker-remaining { display: none; }
    }

    @media (max-width: 760px) and (max-height: 720px) {
      .quiz-area { padding-top: 8px; padding-bottom: 8px; }
      .quiz-topline { margin-bottom: 6px; }
      .question-count { display: none; }
      h2 { margin-bottom: 8px; font-size: 21px; }
      .answer { min-height: 44px; }
      .intermediate-stage .answer { min-height: 36px; padding: 4px 8px; }
      .feedback { min-height: 36px; margin-top: 6px; padding: 6px 8px; }
    }

    @media (max-width: 760px) and (max-height: 600px) {
      .dog-photo { height: 110px; }
      .intermediate-stage .dog-photo { height: 86px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🐾</span><span>Pfotenwissen</span></div>
      <span class="level-tag">Für Anfänger</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">Das Rassen-Rätsel</p>
          <h1 class="visually-hidden" id="page-title">Hunderassen-Quiz</h1>
          <button class="photo-trigger" id="photo-trigger" type="button" aria-label="Hundefoto in Vollbild anzeigen">
            <img class="dog-photo" id="dog-photo" alt="Hund der aktuellen Quizfrage" width="1000" height="700">
            <span class="photo-status" id="photo-status" role="status">Foto wird geladen …</span>
          </button>
        </div>
        <p class="intro-note"><span class="note-dot" aria-hidden="true"></span>100 Rassen · ohne Zeitdruck · mit Tipps</p>
      </section>

      <section class="quiz-area" aria-label="Hundequiz">
        <div id="quiz-view">
          <div class="quiz-topline">
            <span id="progress-label">Frage 1 von 100</span>
            <div class="quiz-status">
              <span class="score-chip" id="score-label">0 richtig</span>
              <div class="joker-choice" role="group" aria-label="Anzahl der Joker auswählen">
                <span class="joker-caption">Joker</span>
                <button class="joker-count-button" type="button" data-joker-count="3" aria-label="Drei Joker verwenden" aria-pressed="true" title="Drei Joker verwenden">3</button>
                <button class="joker-count-button" type="button" data-joker-count="4" aria-label="Vier Joker verwenden" aria-pressed="false" title="Vier Joker verwenden">4</button>
              </div>
              <span class="joker-remaining" id="joker-remaining">3 übrig</span>
            </div>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Quizfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="question-count" id="question-category">Rasse erkennen</p>
          <h2 id="question-text" tabindex="-1">Zu welcher Rasse gehört dieser Hund?</h2>
          <div class="answers" id="answers" role="group" aria-labelledby="question-text"></div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
          <div class="quiz-footer">
            <div class="joker-actions" role="group" aria-label="Joker">
              <button class="joker-button" type="button" data-joker="half" aria-label="50:50: eine falsche Antwort ausblenden" title="50:50: Eine falsche Antwort ausblenden" disabled>50:50</button>
              <button class="joker-button" type="button" data-joker="hint" aria-label="Hinweis mit den Anfangsbuchstaben anzeigen" title="Hinweis: Anfangsbuchstaben zeigen" disabled>?</button>
              <button class="joker-button" type="button" data-joker="skip" aria-label="Frage überspringen" title="Frage überspringen" disabled>»</button>
              <button class="joker-button" type="button" data-joker="retry" aria-label="Einen Extra-Versuch erhalten" title="Extra-Versuch: noch einmal raten" disabled>+1</button>
            </div>
            <button class="next-button" id="next-button" type="button" disabled>Weiter <span aria-hidden="true">→</span></button>
          </div>
        </div>
        <section class="result-view" id="result-view" aria-labelledby="result-title" hidden>
          <p class="eyebrow" style="color: var(--green)">Quiz abgeschlossen</p>
          <div class="result-score" id="result-score" aria-label="Ergebnis"></div>
          <h2 id="result-title" tabindex="-1"></h2>
          <p class="result-copy" id="result-copy"></p>
          <button class="restart-button" id="restart-button" type="button">Nochmal spielen <span aria-hidden="true">↻</span></button>
        </section>
      </section>
    </main>
  </div>

  <dialog class="photo-dialog" id="photo-dialog" aria-label="Hundefoto im Vollbild">
    <button class="photo-close" id="photo-close" type="button" aria-label="Vollbild schließen">×</button>
    <img class="fullscreen-photo" id="fullscreen-photo" alt="">
  </dialog>

  <script>
    const breedCatalog = [
      { name: "Affenpinscher", path: "affenpinscher" },
      { name: "Afghanischer Windhund", path: "hound/afghan" },
      { name: "Airedale Terrier", path: "airedale" },
      { name: "Akita", path: "akita" },
      { name: "Appenzeller Sennenhund", path: "appenzeller" },
      { name: "Australian Kelpie", path: "australian/kelpie" },
      { name: "Australian Shepherd", path: "australian/shepherd" },
      { name: "Basenji", path: "basenji" },
      { name: "Beagle", path: "beagle" },
      { name: "Bluetick Coonhound", path: "bluetick" },
      { name: "Borzoi", path: "borzoi" },
      { name: "Bouvier des Flandres", path: "bouvier" },
      { name: "Boxer", path: "boxer" },
      { name: "Briard", path: "briard" },
      { name: "Norwegischer Buhund", path: "buhund/norwegian" },
      { name: "Boston Terrier", path: "bulldog/boston" },
      { name: "Englische Bulldogge", path: "bulldog/english" },
      { name: "Französische Bulldogge", path: "bulldog/french" },
      { name: "Staffordshire Bullterrier", path: "bullterrier/staffordshire" },
      { name: "Australian Cattle Dog", path: "cattledog/australian" },
      { name: "Pudel", path: "poodle/standard" },
      { name: "Chihuahua", path: "chihuahua" },
      { name: "Chow Chow", path: "chow" },
      { name: "Clumber Spaniel", path: "clumber" },
      { name: "Jack Russell Terrier", path: "terrier/russell" },
      { name: "Border Collie", path: "collie/border" },
      { name: "Cardigan Welsh Corgi", path: "corgi/cardigan" },
      { name: "Coton de Tulear", path: "cotondetulear" },
      { name: "Dackel", path: "dachshund" },
      { name: "Dalmatiner", path: "dalmatian" },
      { name: "Deutsche Dogge", path: "dane/great" },
      { name: "Danisch-Schwedischer Farmhund", path: "danishswedish/farmdog" },
      { name: "Scottish Deerhound", path: "deerhound/scottish" },
      { name: "Dobermann", path: "doberman" },
      { name: "Norwegischer Elchhund", path: "elkhound/norwegian" },
      { name: "Entlebucher Sennenhund", path: "entlebucher" },
      { name: "American Eskimo Dog", path: "eskimo" },
      { name: "Finnischer Lapphund", path: "finnish/lapphund" },
      { name: "Bichon Frise", path: "frise/bichon" },

      { name: "Brittany Spaniel", path: "spaniel/brittany" },
      { name: "English Cocker Spaniel", path: "spaniel/cocker" },
      { name: "Irish Water Spaniel", path: "spaniel/irish" }
    ];

    function shuffle(items) {
      const shuffled = [...items];
      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function createQuestions() {
      return shuffle(breedCatalog).map(breed => {
        const otherBreeds = shuffle(breedCatalog.filter(candidate => candidate !== breed)).slice(0, 3);
        const optionsForThree = shuffle([breed, ...otherBreeds.slice(0, 2)]);
        const optionsForFour = shuffle([breed, ...otherBreeds]);
        return {
          breed: breed.name,
          imagePath: breed.path,
          answerSets: {
            3: { answers: optionsForThree.map(option => option.name), correct: optionsForThree.indexOf(breed) },
            4: { answers: optionsForFour.map(option => option.name), correct: optionsForFour.indexOf(breed) }
          },
          explanation: "Achte auf Fell, Körperform und Ohren, um Hunderassen zu unterscheiden."
        };
      });
    }

    function getCurrentAnswerSet(questionIndex = currentQuestion) {
      const optionCount = jokerLimit === 3 && questionIndex === 19 ? 4 : 3;
      return questions[questionIndex].answerSets[optionCount];
    }

    const imageCache = new Map();
    let questions = createQuestions();

    const pageShell = document.querySelector(".page-shell");
    const quizView = document.querySelector("#quiz-view");
    const resultView = document.querySelector("#result-view");
    const progressLabel = document.querySelector("#progress-label");
    const scoreLabel = document.querySelector("#score-label");
    const progressTrack = document.querySelector(".progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const categoryLabel = document.querySelector("#question-category");
    const questionText = document.querySelector("#question-text");
    const dogPhoto = document.querySelector("#dog-photo");
    const photoTrigger = document.querySelector("#photo-trigger");
    const photoStatus = document.querySelector("#photo-status");
    const photoDialog = document.querySelector("#photo-dialog");
    const fullscreenPhoto = document.querySelector("#fullscreen-photo");
    const answersElement = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const jokerRemaining = document.querySelector("#joker-remaining");
    const jokerCountButtons = [...document.querySelectorAll("[data-joker-count]")];
    const jokerButtons = [...document.querySelectorAll("[data-joker]")];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let photoLoaded = false;
    let jokerLimit = 3;
    let extraTryArmed = false;
    const usedJokers = new Set();

    photoTrigger.addEventListener("click", () => {
      fullscreenPhoto.src = dogPhoto.currentSrc || dogPhoto.src;
      fullscreenPhoto.alt = dogPhoto.alt;
      photoDialog.showModal();
    });

    document.querySelector("#photo-close").addEventListener("click", () => photoDialog.close());
    photoDialog.addEventListener("click", event => {
      if (event.target === photoDialog) photoDialog.close();
    });
    photoDialog.addEventListener("close", () => photoTrigger.focus({ preventScroll: true }));

    jokerCountButtons.forEach(button => {
      button.addEventListener("click", () => {
        if (usedJokers.size > 0) return;
        jokerLimit = Number(button.dataset.jokerCount);
        updateJokerControls();
      });
    });

    jokerButtons.forEach(button => {
      button.addEventListener("click", () => useJoker(button.dataset.joker));
    });

    function updateJokerControls() {
      jokerRemaining.textContent = `${jokerLimit - usedJokers.size} übrig`;
      jokerCountButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.jokerCount) === jokerLimit));
        button.disabled = usedJokers.size > 0;
      });
      jokerButtons.forEach(button => {
        button.disabled = !photoLoaded || answered || usedJokers.has(button.dataset.joker) || usedJokers.size >= jokerLimit;
      });
    }

    function useJoker(type) {
      if (!photoLoaded || answered || usedJokers.has(type) || usedJokers.size >= jokerLimit) return;
      usedJokers.add(type);
      const answerSet = getCurrentAnswerSet();

      if (type === "half") {
        const wrongAnswers = [...answersElement.children].filter((button, index) => index !== answerSet.correct && !button.hidden);
        const removedAnswer = wrongAnswers[Math.floor(Math.random() * wrongAnswers.length)];
        if (removedAnswer) removedAnswer.hidden = true;
        feedback.textContent = "50:50: Eine falsche Antwort wurde ausgeblendet.";
      } else if (type === "hint") {
        const initials = question.breed.split(/[\s-]+/).map(word => word[0]).join(" · ");
        feedback.textContent = `Hinweis: Die Anfangsbuchstaben lauten ${initials}.`;
      } else if (type === "skip") {
        feedback.textContent = "Frage übersprungen.";
        updateJokerControls();
        advanceQuestion();
        return;
      } else if (type === "retry") {
        extraTryArmed = true;
        feedback.textContent = "Extra-Versuch aktiv: Bei einer falschen Antwort darfst du noch einmal raten.";
      }

      updateJokerControls();
    }

    function getBreedImage(path) {
      if (!imageCache.has(path)) {
        const imageRequest = fetch(`https://dog.ceo/api/breed/${path}/images/random`)
          .then(response => {
            if (!response.ok) throw new Error("Bildquelle nicht erreichbar");
            return response.json();
          })
          .then(result => {
            if (result.status !== "success") throw new Error("Kein Bild für diese Rasse gefunden");
            return result.message;
          });
        imageCache.set(path, imageRequest);
      }
      return imageCache.get(path);
    }

    async function loadQuestionImage(question, questionIndex) {
      try {
        const imageUrl = await getBreedImage(question.imagePath);
        const image = new Image();
        image.src = imageUrl;
        await image.decode();
        if (questionIndex !== currentQuestion) return;

        dogPhoto.src = imageUrl;
        dogPhoto.alt = `Hundefoto zu Frage ${questionIndex + 1}`;
        photoLoaded = true;
        photoStatus.hidden = true;
        photoTrigger.disabled = false;
        [...answersElement.children].forEach(button => { button.disabled = false; });
        updateJokerControls();
      } catch {
        if (questionIndex !== currentQuestion) return;
        photoStatus.textContent = "Foto nicht verfügbar. Diese Frage kann übersprungen werden.";
        nextButton.disabled = false;
        nextButton.innerHTML = currentQuestion === questions.length - 1
          ? 'Ergebnis ansehen <span aria-hidden="true">→</span>'
          : 'Überspringen <span aria-hidden="true">→</span>';
        updateJokerControls();
      }
    }

    function renderQuestion() {
      const question = questions[currentQuestion];
      const answerSet = getCurrentAnswerSet();
      answered = false;
      photoLoaded = false;
      extraTryArmed = false;
      progressLabel.textContent = `Frage ${currentQuestion + 1} von ${questions.length}`;
      scoreLabel.textContent = `${score} richtig`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion));
      progressFill.style.width = `${(currentQuestion / questions.length) * 100}%`;
      categoryLabel.textContent = currentQuestion === 19 && jokerLimit === 3
        ? "Zwischenstufe · 4 Antworten"
        : `Rasse ${currentQuestion + 1}`;
      pageShell.classList.toggle("intermediate-stage", answerSet.answers.length === 4);
      questionText.textContent = "Zu welcher Rasse gehört dieser Hund?";
      dogPhoto.removeAttribute("src");
      dogPhoto.alt = "Hundefoto wird geladen";
      photoTrigger.disabled = true;
      photoStatus.hidden = false;
      photoStatus.textContent = "Foto wird geladen …";
      feedback.textContent = "";
      nextButton.disabled = true;
      nextButton.innerHTML = currentQuestion === questions.length - 1
        ? 'Ergebnis ansehen <span aria-hidden="true">→</span>'
        : 'Weiter <span aria-hidden="true">→</span>';
      answersElement.replaceChildren(...answerSet.answers.map((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.disabled = true;
        button.innerHTML = `<span class="answer-key">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span><span class="answer-mark" aria-hidden="true"></span>`;
        button.querySelector(".answer-text").textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        return button;
      }));
      questionText.focus({ preventScroll: true });
      updateJokerControls();
      loadQuestionImage(question, currentQuestion);
    }

    function chooseAnswer(selectedIndex) {
      if (answered) return;
      const question = questions[currentQuestion];
      const answerSet = getCurrentAnswerSet();
      const isCorrect = selectedIndex === answerSet.correct;

      if (!isCorrect && extraTryArmed) {
        extraTryArmed = false;
        const selectedButton = answersElement.children[selectedIndex];
        selectedButton.disabled = true;
        selectedButton.classList.add("incorrect");
        selectedButton.querySelector(".answer-mark").textContent = "×";
        feedback.textContent = "Nicht ganz. Der Extra-Versuch gibt dir noch eine Antwort.";
        updateJokerControls();
        return;
      }

      answered = true;
      if (isCorrect) score += 1;

      [...answersElement.children].forEach((button, index) => {
        button.disabled = true;
        if (index === answerSet.correct) {
          button.classList.add("correct");
          button.querySelector(".answer-mark").textContent = "✓";
        } else if (index === selectedIndex) {
          button.classList.add("incorrect");
          button.querySelector(".answer-mark").textContent = "×";
        }
      });

      feedback.innerHTML = `<strong>${isCorrect ? "Richtig!" : `Das ist ein ${question.breed}.`}</strong> ${question.explanation}`;
      scoreLabel.textContent = `${score} richtig`;
      progressTrack.setAttribute("aria-valuenow", String(currentQuestion + 1));
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      nextButton.disabled = false;
      updateJokerControls();
      nextButton.focus();
    }

    function advanceQuestion() {
      if (currentQuestion === questions.length - 1) {
        showResult();
        return;
      }
      currentQuestion += 1;
      renderQuestion();
    }

    function showResult() {
      quizView.hidden = true;
      resultView.hidden = false;
      document.querySelector("#result-score").textContent = `${score}/${questions.length}`;
      const title = document.querySelector("#result-title");
      const copy = document.querySelector("#result-copy");
      if (score === questions.length) {
        title.textContent = "Richtig stark!";
        copy.textContent = "Du hast alle Hunderassen erkannt. Dein Rassenwissen ist wirklich beeindruckend.";
      } else if (score >= 75) {
        title.textContent = "Gutes Rassenwissen!";
        copy.textContent = "Du hast schon viele Rassen erkannt. Mit den kurzen Tipps lernst du noch ein paar spannende Merkmale dazu.";
      } else {
        title.textContent = "Ein guter Anfang!";
        copy.textContent = "Einige Rassen sehen sich ganz schön ähnlich. Spiel gern noch einmal und achte auf Fell, Körperform und Ohren.";
      }
      title.focus({ preventScroll: true });
    }

    nextButton.addEventListener("click", () => {
      if (!answered && photoLoaded) return;
      advanceQuestion();
    });

    document.querySelector("#restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      jokerLimit = 3;
      extraTryArmed = false;
      usedJokers.clear();
      questions = createQuestions();
      imageCache.clear();
      resultView.hidden = true;
      quizView.hidden = false;
      updateJokerControls();
      renderQuestion();
    });

    renderQuestion();
  </script>
